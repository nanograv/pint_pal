[build-system]
requires = ["setuptools>=61.0", "versioneer[toml]==0.28"]
build-backend = "setuptools.build_meta"

[project]
name = "pint_pal"
dynamic = ["version"]
authors = [
  { name="Joe Glaser", email="joe.glaser@nanograv.org" },
  { name="Joe Swiggum", email="joe.swiggum@nanograv.org" },
  { name="Thankful Cromartie", email="thanful.cromartie@nanograv.org" },
  { name="Deborah Good", email="deborah.good@nanograv.org" },
  { name="Anne Archibald", email="anne.archibald@nanograv.org" },
  { name="Kevin Wilson", email="kevin.wilson@nanograv.org" },
  { name="Ross Jennings", email="ross.jennings@nanograv.org" },
  { name="Jeremy Baier", email="jeremy.baier@nanograv.org"},
  { name="Michael Lam", email="michael.lam@nanograv.org"}
]
description = "A long-lived repository for NANOGrav Pulsar Timing analysis work."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ruamel.yaml",
    "pint_pulsar>=1.1.8",
    "enterprise-pulsar>=3.5.0",
    "enterprise-extensions>=v2.4.1",
    "pytest",
    "nbconvert",
    "ipywidgets>=7.6.3",
    "pypulse>=0.0.1",
    "numpy",
    "weasyprint",
    "pytest-xdist[psutil]>=2.3.0",
    "notebook",
    "seaborn",
    "gitpython",
    "la-forge",
    "arviz",
    "dill",
    "discovery @ git+https://github.com/jeremy-baier/discovery@twg-dev",
    "fastshermanmorrison-pulsar",
    "jax",
    "loguru",
    "numpyro",
    "optax",
    "pandas",
    "threadpoolctl",
    "scikit-sparse>=0.4.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.package-data]
pint_pal = ["defaults.yaml", "plot_settings.yaml", "discovery_priors.json"]

[project.urls]
"Homepage" = "https://github.com/nanograv/pint_pal"
"Bug Tracker" = "https://github.com/nanograv/pint_pal/issues"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "src/pint_pal/_version.py"
versionfile_build = "pint_pal/_version.py"
tag_prefix = "v"
parentdir_prefix = "pint-pal-"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.environments]
py311 = { dependencies = { python = "3.11.*" } }
py312 = { dependencies = { python = "3.12.*" } }
py313 = { dependencies = { python = "3.13.*" } }
py314 = { dependencies = { python = "3.14.*" } }

[tool.pixi.dependencies]
gcc = "*"
setuptools = "*"
cython = ">=3.2.4"
suitesparse = "*"

[tool.pixi.pypi-options]
no-build-isolation = ["scikit-sparse"] # so it can find pixi's suitesparse

[tool.pixi.activation.env]
CPATH = "$CONDA_PREFIX/include/suitesparse"
LIBRARY_PATH = "$CONDA_PREFIX/lib"
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib"

[tool.pixi.pypi-dependencies]
pint-pal = { path = ".", editable = true }
