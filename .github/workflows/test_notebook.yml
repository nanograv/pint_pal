# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: "Notebook Pipeline (Ubuntu)"

on:
  pull_request:
    branches: 
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm] # Once we get the tex packages changed, we should include "macos-13"

    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.81.0
        cache: true
        locked: true
    - name: Run Unit Tests
      shell: bash -el {0}
      run: |
        pixi run pytest --ignore=tests/test_run_notebook.py
    - name: Test with Standard Pulsar
      shell: bash -el {0}
      run: |
        export PULSAR_NAME='J0605+3757'
        export JUPYTER_PLATFORM_DIRS=1
        pixi run pytest tests/test_run_notebook.py -k $PULSAR_NAME
        ls -lah
        mv tmp* nb_outputs
    - name: Archive Notebook Output Files
      uses: actions/upload-artifact@v7
      with:
        name: TestNB-OutputFiles_${{ matrix.python-version }}_${{ matrix.os }}_${{ steps.date.outputs.date }}
        path: |
          nb_outputs/*/*.pdf
          nb_outputs/*/*.tim
          nb_outputs/*/*.par
        compression-level: 6
