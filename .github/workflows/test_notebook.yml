# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: "Notebook Pipeline (Ubuntu)"

on:
  pull_request:
    branches: 
      - main

jobs:
  pinned:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm] # Once we get the tex packages changed, we should include "macos-13"

    steps:
    - name: Install required Ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install texlive-latex-base cm-super-minimal pdftk latex2html

    - uses: actions/checkout@v7

    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.81.0
        cache: true
        locked: true

    - name: Run unit tests
      shell: bash
      run: |
        pixi run pytest --ignore=tests/test_run_notebook.py

    - name: Test with standard pulsar
      shell: bash
      run: |
        pixi run pytest tests/test_run_notebook.py
        ls -lah
        mv tmp* nb_outputs

    - name: Upload notebook outputs
      uses: actions/upload-artifact@v7
      with:
        name: nb-outputs-${{ matrix.os }}
        path: |
          nb_outputs/*/*.pdf
          nb_outputs/*/*.tim
          nb_outputs/*/*.par
        compression-level: 6
